<!DOCTYPE html>
<html>
<head>
  <title>ChatterBox Login</title>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbcH_OAGxFrfxPRarAnY4PUdAdz-rjymE",
      authDomain: "chat-ad084.firebaseapp.com",
      databaseURL: "https://chat-ad084-default-rtdb.firebaseio.com",
      projectId: "chat-ad084",
      storageBucket: "chat-ad084.firebasestorage.app",
      messagingSenderId: "703998786296",
      appId: "1:703998786296:web:99cabe960b1b00dd1d990d",
      measurementId: "G-MEVR8MCS49"
    };

    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f2f2f2;
      font-family: Arial;
      padding-top: 40px;
    }

    #card {
      background: white;
      padding: 40px;
      width: 400px;
      border-radius: 15px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    #card h1 {
      margin: 0;
      font-size: 36px;
    }

    input {
      padding: 14px;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 100%;
    }

    button {
      padding: 14px;
      font-size: 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #4da6ff;
      color: white;
      width: 100%;
    }

    button:hover {
      background: #3399ff;
    }
    input, button {
  width: 100%;
  box-sizing: border-box;
}

  </style>
</head>

<body>

  <div id="card">
    <h1>ChatterBox</h1>

    <input id="username" placeholder="Username">
    <input id="password" placeholder="Password" type="password">

    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Log In</button>
  </div>

<script>
  const realtimeDB = firebase.database();

  // SIGN UP
  document.getElementById("signupBtn").onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Username and password required.");
      return;
    }

    try {
      const snap = await realtimeDB.ref("users/" + username).get();

      if (snap.exists()) {
        alert("Username already taken.");
        return;
      }

      await realtimeDB.ref("users/" + username).set({
        username: username,
        password: password
      });

      localStorage.setItem("username", username);
      window.location.href = "index.html";

    } catch (error) {
      console.error("SIGN UP ERROR:", error);
      alert("Sign up failed:\n\n" + error.message);
    }
  };


  // LOGIN
  document.getElementById("loginBtn").onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Username and password required.");
      return;
    }

    try {
      const snap = await realtimeDB.ref("users/" + username).get();

      if (!snap.exists()) {
        alert("User not found.");
        return;
      }

      const data = snap.val();

      if (data.password !== password) {
        alert("Incorrect password.");
        return;
      }

      localStorage.setItem("username", username);
      window.location.href = "index.html";

    } catch (error) {
      console.error("LOGIN ERROR:", error);
      alert("Login failed:\n\n" + error.message);
    }
  };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox Admin</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#111;display:flex}
#sidebar{width:270px;height:100vh;background:#292929;color:white;padding:20px;display:flex;flex-direction:column;position:fixed;left:0;top:0}
#sidebarTitle{font-size:30px;font-weight:bold;margin:0 0 5px}.sub{color:#aaa;font-size:14px;margin-bottom:15px}
#badge{background:#4da6ff;border-radius:8px;padding:9px 11px;font-weight:bold;margin-bottom:15px}
#search{width:100%;padding:12px;font-size:16px;border:0;border-radius:8px;outline:0;margin-bottom:12px}
#users{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.user{width:100%;padding:12px;background:#3b3b3b;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:18px;text-align:left}
.user:hover{background:#4a4a4a}.user.active{background:#4da6ff;font-weight:bold}
.user small{display:block;color:#bbb;font-size:12px;margin-top:3px}.user.active small{color:#eaf5ff}
.sidebtn{width:100%;padding:11px;border:0;border-radius:8px;background:#4da6ff;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:9px}
.sidebtn:hover{background:#3399ff}#logout{background:#555}#logout:hover{background:#666}
#chat{margin-left:270px;width:calc(100% - 270px);height:100vh;display:flex;flex-direction:column;background:#fff}
header{flex-shrink:0;padding:10px 20px 8px;text-align:center;border-bottom:1px solid #ddd;position:relative}
h1{margin:0;font-size:42px;color:#222}#chatName{min-height:24px;margin-top:3px;font-size:18px;color:#777}
#actions{position:absolute;right:18px;top:18px;display:none;gap:8px}.action{border:0;border-radius:8px;padding:9px 12px;color:#fff;background:#4da6ff;cursor:pointer;font-weight:bold}
#delete{background:#e53935}#messages{flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#f5f7fa}
.bubble{max-width:70%;padding:10px 15px;border-radius:15px;word-wrap:break-word;font-size:22px;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.me{align-self:flex-end;background:#4da6ff;color:#fff;border-bottom-right-radius:4px}.other{align-self:flex-start;background:#e5e5e5;color:#111;border-bottom-left-radius:4px}
.name{font-size:14px;opacity:.7;margin-bottom:4px;font-weight:bold}.empty{margin:auto;text-align:center;color:#777;padding:30px}
#inputRow{display:flex;gap:10px;padding:12px;background:#fff;border-top:1px solid #ddd}
#input{flex:1;padding:13px 15px;font-size:21px;border:1px solid #ccc;border-radius:10px;outline:0}#send{padding:13px 25px;border:0;border-radius:10px;background:#4da6ff;color:#fff;font-size:21px;font-weight:bold;cursor:pointer}
#status{padding:7px 15px;border-top:1px solid #ddd;background:#fff;color:#777;font-size:13px;text-align:center}
#error{position:fixed;right:20px;top:20px;z-index:9999;display:none;background:#e53935;color:#fff;padding:12px 18px;border-radius:8px;font-weight:bold}
@media(max-width:750px){#sidebar{width:210px;padding:14px}#chat{margin-left:210px;width:calc(100% - 210px)}h1{font-size:32px}.bubble{font-size:18px}#actions{position:static;justify-content:center;margin-top:8px}}
</style>
</head>
<body>
<aside id="sidebar">
<h2 id="sidebarTitle">Admin</h2>
<div class="sub">ChatterBox administration</div>
<div id="badge">Logged in as Shadow_1002</div>
<input id="search" placeholder="Search users" autocomplete="off">
<div id="users"><div class="empty" style="color:#aaa">Loading users...</div></div>
<button class="sidebtn" id="refresh">Refresh Users</button>
<button class="sidebtn" id="logout">Logout</button>
</aside>
<main id="chat">
<header>
<h1>ChatterBox</h1>
<div id="chatName">Select a user to start an admin chat</div>
<div id="actions">
<button class="action" id="clear">Clear Chat</button>
<button class="action" id="delete">Delete Account</button>
</div>
</header>
<div id="messages"><div class="empty"><h2>Select a user</h2><p>You can talk to any user without adding them as a friend.</p></div></div>
<div id="inputRow"><input id="input" placeholder="Select a user first..." disabled autocomplete="off"><button id="send" disabled>Send</button></div>
<div id="status">Users: 0</div>
</main>
<div id="error"></div>

<script>
const firebaseConfig={
apiKey:"AIzaSyDbcH_OAGxFrfxPRarAnY4PUdAdz-rjymE",
authDomain:"chat-ad084.firebaseapp.com",
databaseURL:"https://chat-ad084-default-rtdb.firebaseio.com",
projectId:"chat-ad084",
storageBucket:"chat-ad084.firebasestorage.app",
messagingSenderId:"703998786296",
appId:"1:703998786296:web:99cabe960b1b00dd1d990d",
measurementId:"G-MEVR8MCS49"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const ADMIN="Shadow_1002";
const logged=localStorage.getItem("username");

if(!logged){location.href="../auth.html";}
else if(logged!==ADMIN){
document.body.innerHTML='<div style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fa;font-family:Arial;text-align:center"><div><h1>Access denied</h1><p>This page is only for the ChatterBox administrator.</p><button onclick="location.href=\'../index.html\'" style="padding:11px 18px;border:0;border-radius:8px;background:#4da6ff;color:white">Back to ChatterBox</button></div></div>';
throw new Error("Not admin");
}

let users={},selected=null,chatID=null,chatRef=null;

function cid(a,b){return[a,b].sort().join("_");}
function error(msg,ok=false){const e=document.getElementById("error");e.textContent=msg;e.style.background=ok?"#4da6ff":"#e53935";e.style.display="block";setTimeout(()=>e.style.display="none",2500);}
function renderUsers(){
const list=document.getElementById("users"),q=document.getElementById("search").value.toLowerCase().trim();
list.innerHTML="";
const names=Object.keys(users).filter(n=>n!==ADMIN&&n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));
if(!names.length){list.innerHTML='<div class="empty" style="color:#aaa;padding:15px">No users found.</div>';return;}
names.forEach(n=>{
const b=document.createElement("button");b.className="user"+(selected===n?" active":"");
b.innerHTML="<span></span><small>Open admin chat</small>";b.querySelector("span").textContent=n;b.onclick=()=>selectUser(n);list.appendChild(b);
});
}
async function loadUsers(){
try{
const s=await db.ref("users").once("value");users=s.val()||{};renderUsers();
document.getElementById("status").textContent="Users: "+Object.keys(users).filter(n=>n!==ADMIN).length;
}catch(e){console.error(e);error("Could not load users. Check Firebase Database Rules.");}
}
function selectUser(n){
selected=n;chatID=cid(ADMIN,n);renderUsers();
document.getElementById("chatName").textContent="Chat with "+n;
document.getElementById("actions").style.display="flex";
document.getElementById("input").disabled=false;document.getElementById("send").disabled=false;
document.getElementById("input").placeholder="Type a message...";
listenChat();
}
function listenChat(){
if(chatRef)chatRef.off();
chatRef=db.ref("privateChats/"+chatID+"/messages");
document.getElementById("messages").innerHTML="";
chatRef.orderByChild("time").on("child_added",s=>renderMessage(s.val().user,s.val().text));
chatRef.once("value").then(s=>{if(!s.exists())document.getElementById("messages").innerHTML='<div class="empty"><h2>No messages yet</h2><p>Send the first message to '+escapeHTML(selected)+'</p></div>';});
}
function renderMessage(user,text){
const b=document.createElement("div");b.className="bubble "+(user===ADMIN?"me":"other");
const n=document.createElement("div");n.className="name";n.textContent=user;
const t=document.createElement("div");t.textContent=text;b.append(n,t);
const box=document.getElementById("messages");box.appendChild(b);box.scrollTop=box.scrollHeight;
}
async function sendMessage(){
if(!selected)return;const input=document.getElementById("input"),text=input.value.trim();if(!text)return;
try{
await db.ref("privateChats/"+chatID).update({createdAt:firebase.database.ServerValue.TIMESTAMP});
await db.ref("privateChats/"+chatID+"/messages").push({text,user:ADMIN,time:Date.now()});
await db.ref("unreadChats/"+selected+"/"+chatID).set(true);
input.value="";input.focus();
}catch(e){console.error(e);error("The message could not be sent.");}
}
async function clearChat(){
if(!selected)return;if(!confirm("Delete every message in the chat with "+selected+"?"))return;
try{
await db.ref("privateChats/"+chatID).remove();
await db.ref("unreadChats/"+ADMIN+"/"+chatID).remove();
await db.ref("unreadChats/"+selected+"/"+chatID).remove();
document.getElementById("messages").innerHTML='<div class="empty"><h2>No messages</h2><p>The chat is now empty.</p></div>';
error("Chat cleared.",true);
}catch(e){console.error(e);error("Could not clear the chat.");}
}
async function deleteAccount(){
if(!selected)return;const name=selected;
if(!confirm("Delete the account '"+name+"'?\n\nThis removes the account, friend references and associated private chats."))return;
if(!confirm("FINAL CONFIRMATION\n\nPermanently delete "+name+"?"))return;
try{
const us=(await db.ref("users").once("value")).val()||{};
const chats=(await db.ref("privateChats").once("value")).val()||{};
const updates={};
updates["users/"+name]=null;
updates["unreadChats/"+name]=null;

Object.keys(us).forEach(other=>{
if(us[other]&&us[other].friends&&Object.prototype.hasOwnProperty.call(us[other].friends,name))
updates["users/"+other+"/friends/"+name]=null;
if(other!==name){
const id=cid(name,other);
if(Object.prototype.hasOwnProperty.call(chats,id)){
updates["privateChats/"+id]=null;
updates["unreadChats/"+other+"/"+id]=null;
}
}
});
const adminChat=cid(ADMIN,name);updates["unreadChats/"+ADMIN+"/"+adminChat]=null;
await db.ref().update(updates);

if(chatRef)chatRef.off();chatRef=null;selected=null;chatID=null;
document.getElementById("actions").style.display="none";
document.getElementById("input").disabled=true;document.getElementById("send").disabled=true;
document.getElementById("input").placeholder="Select a user first...";
document.getElementById("chatName").textContent="Select a user to start an admin chat";
document.getElementById("messages").innerHTML='<div class="empty"><h2>Select a user</h2><p>You can talk to any user without adding them as a friend.</p></div>';
await loadUsers();error(name+" account deleted.",true);
}catch(e){console.error(e);error("The account could not be deleted. Check Firebase Database Rules.");}
}
function escapeHTML(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

document.getElementById("search").oninput=renderUsers;
document.getElementById("refresh").onclick=loadUsers;
document.getElementById("send").onclick=sendMessage;
document.getElementById("clear").onclick=clearChat;
document.getElementById("delete").onclick=deleteAccount;
document.getElementById("logout").onclick=()=>{localStorage.removeItem("username");location.href="../auth.html";};
document.getElementById("input").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendMessage();}};

loadUsers();
</script>
</body>
</html>
